<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Melame">
<title>Melame — tvoja glasba</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="gate" class="gate hidden">
  <div class="gate-card">
    <div class="gate-logo">🎵</div>
    <h1>Melame</h1>
    <p class="gate-sub">Tvoja zasebna glasbena aplikacija.<br>Poslušajo lahko samo povabljene osebe.</p>
    <div class="gate-box">
      <label for="inviteCode">Vabilni kod</label>
      <input type="text" id="inviteCode" placeholder="npr. MELAM-2024" autocomplete="off">
      <button id="enterBtn" class="btn primary big">Vstopi v aplikacijo</button>
      <p id="gateError" class="gate-error hidden">Ta kod ne velja.</p>
    </div>
  </div>
</div>
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🎵</span>
      <div><h2>Melame</h2><span class="brand-sub">zasebno</span></div>
    </div>
    <div class="topbar-actions">
      <button id="installBtn" class="btn ghost hidden">⬇</button>
      <button id="inviteBtn" class="btn ghost">👥</button>
      <button id="logoutBtn" class="btn ghost">⎋</button>
    </div>
  </header>
  <main class="content">
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="🔍 Išči…">
      <button id="uploadBtn" class="btn primary">+ Pesem</button>
    </div>
    <div id="songList" class="song-list"></div>
    <div id="emptyState" class="empty hidden">
      <p><b>Ni pesmi.</b><br>Dodaj prvo z »+ Pesem«.</p>
    </div>
  </main>
  <div id="player" class="player hidden">
    <div class="player-cover" id="playerCover">🎵</div>
    <div class="player-info">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-artist" id="playerArtist">—</div>
      <input type="range" id="seekBar" class="seek" min="0" max="100" value="0">
      <div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>
    <div class="player-controls">
      <button id="playPauseBtn" class="ctrl main">▶</button>
      <input type="range" id="volBar" class="vol" min="0" max="1" step="0.01" value="1">
    </div>
  </div>
</div>
<div id="uploadModal" class="modal hidden">
  <div class="modal-card">
    <h3>🎤 Nova pesem</h3>
    <label><span>Naslov</span><input type="text" id="upTitle"></label>
    <label><span>Izvajalec</span><input type="text" id="upArtist"></label>
    <label><span>MP3</span><input type="file" id="upFile" accept="audio/*"></label>
    <div class="modal-actions">
      <button id="upCancel" class="btn ghost">Prekliči</button>
      <button id="upSave" class="btn primary">Objavi</button>
    </div>
  </div>
</div>
<div id="inviteModal" class="modal hidden">
  <div class="modal-card">
    <h3>👥 Povabi</h3>
    <div class="invite-code-box"><span id="inviteCodeShow">—</span><button id="copyCodeBtn" class="btn ghost">📋</button></div>
    <div class="modal-actions"><button id="inviteClose" class="btn primary">Zapri</button></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<audio id="audioEl"></audio>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
</script>
</body>
</html>
